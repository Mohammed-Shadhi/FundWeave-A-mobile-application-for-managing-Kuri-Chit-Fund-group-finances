name: fundweave
description: "FundWeave - Save together, grow together."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Razorpay
  razorpay_flutter: ^1.3.7

  # Offline / Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8

  # Local Preferences
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true

flutter_native_splash:
  color: "#0A1F44"
  image: assets/images/logo_full.png